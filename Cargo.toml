[package]
name = "l_os"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
# Mirror every console write to COM1 (the smoke tests read it there). Off by
# default: a production image must not leak console text. `cargo run-serial`.
serial-console = []
# Only for scripts/qemu_wipe_test.py: fills key slot 0, prints the physical
# ranges and the WIPE-REPORT line on COM1. Never together with test-hooks.
wipe-test = []
# Only for tests that must not wipe the test kernel: wipe::trigger counts
# instead of wiping; such a build never shows "amnesisch: ja". Never default.
test-hooks = []
# Tests that need host-side servers: run via scripts/net_tests.sh
net-tests = []

[[test]]
name = "memory"
harness = true

[[test]]
name = "usb_xhci"
harness = true

[[test]]
name = "usermode"
harness = true

[[test]]
name = "processes"
harness = true

[[test]]
name = "capabilities"
harness = true

[[test]]
name = "userland"
harness = true

[[test]]
name = "pci"
harness = true

[[test]]
name = "acpi"
harness = true

[[test]]
name = "wipe_plan"
harness = true

[[test]]
name = "network_denied"
harness = true
required-features = ["net-tests"]

[[test]]
name = "network"
harness = true
required-features = ["net-tests"]

[[test]]
name = "tls"
harness = true
required-features = ["net-tests"]

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[[test]]
name = "exception_invalid_opcode"
harness = false

[[test]]
name = "exception_divide_error"
harness = false

[[test]]
name = "exception_gpf"
harness = false

[[test]]
name = "exception_page_fault"
harness = false

[[test]]
name = "exception_nmi"
harness = false

[[test]]
name = "exception_overflow"
harness = false

[[test]]
name = "exception_bound_range"
harness = false

[[test]]
name = "double_free"
harness = false

[[test]]
name = "smap_violation"
harness = false

[[test]]
name = "smep_violation"
harness = false

[dependencies]
l_core = { path = "crates/l_core" }
bootloader_api = "=0.11.17"
linked_list_allocator = "0.10.6"
smoltcp = { version = "=0.14.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"

[dev-dependencies]
# tests/stack_overflow.rs (the kernel itself no longer uses it).
volatile = "0.2.6"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "l_os"
test = true
bench = false
# The console renders glyphs pixel by pixel with l_core; unoptimized, a
# 2000-line output took ~70 s under QEMU (see tests/framebuffer.rs).
[profile.dev.package.l_core]
opt-level = 3
