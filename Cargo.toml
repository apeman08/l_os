[package]
name = "l_os"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[package.metadata.bootimage]
run-args = ["-cpu", "max"]
test-args = ["-cpu", "max", "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-success-exit-code = 33
test-timeout = 300

[[test]]
name = "memory"
harness = true

[[test]]
name = "usermode"
harness = true

[[test]]
name = "processes"
harness = true

[[test]]
name = "capabilities"
harness = true

[[test]]
name = "userland"
harness = true

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[[test]]
name = "exception_invalid_opcode"
harness = false

[[test]]
name = "exception_divide_error"
harness = false

[[test]]
name = "exception_gpf"
harness = false

[[test]]
name = "exception_page_fault"
harness = false

[[test]]
name = "exception_nmi"
harness = false

[[test]]
name = "exception_overflow"
harness = false

[[test]]
name = "exception_bound_range"
harness = false

[[test]]
name = "double_free"
harness = false

[[test]]
name = "smap_violation"
harness = false

[[test]]
name = "smep_violation"
harness = false

[dependencies]
l_core = { path = "crates/l_core" }
bootloader = { version = "0.9", features = ["map_physical_memory"] }
linked_list_allocator = "0.10.6"
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "l_os"
test = true
bench = false