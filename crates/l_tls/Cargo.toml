[package]
name = "l_tls"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "TLS 1.3 client for Larp OS: rustls with a RustCrypto-based, client-only crypto provider"

# no_std + alloc. The `std` feature only enables the host tests.
[features]
default = []
std = ["rustls/std"]

[dependencies]
rustls = { version = "=0.23.45", default-features = false }
rustls-pki-types = { version = "1", default-features = false, features = ["alloc"] }
webpki = { package = "rustls-webpki", version = "=0.103.15", default-features = false, features = ["alloc"] }

# RustCrypto primitives (no custom cryptography in this repository).
aead = { version = "0.5.2", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
crypto-common = { version = "0.1.6", default-features = false }
der = { version = "0.7.9", default-features = false }
digest = { version = "0.10.7", default-features = false }
ecdsa = { version = "0.16.8", default-features = false, features = ["alloc", "der", "verifying"] }
ed25519-dalek = { version = "2", default-features = false }
hmac = { version = "0.12.1", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "ecdh", "arithmetic"] }
p384 = { version = "0.13.0", default-features = false, features = ["ecdsa", "ecdh", "arithmetic"] }
rand_core = { version = "0.6.4", default-features = false }
rsa = { version = "0.9.2", default-features = false, features = ["sha2"] }
sha2 = { version = "0.10.7", default-features = false }
signature = { version = "2.1.0", default-features = false }
x25519-dalek = { version = "2", default-features = false }
paste = "1"
spin = { version = "0.9", default-features = false, features = ["once"] }

[dev-dependencies]

[[test]]
name = "handshake"
required-features = ["std"]

[[test]]
name = "no_entropy"
required-features = ["std"]
