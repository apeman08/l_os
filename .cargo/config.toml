[build]
target = "x86_64-l_os.json"

[unstable]
json-target-spec = true
build-std-features = ["compiler-builtins-mem"]
build-std = ["core", "compiler_builtins", "alloc"]

[target.'cfg(target_os = "none")']
# Builds a UEFI image (tools/image) and boots it in QEMU; see the script.
runner = "scripts/qemu_runner.sh"